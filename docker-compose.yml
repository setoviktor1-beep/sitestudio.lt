# Docker Compose stack for Coolify (or any VPS).
#
# Coolify notes:
#   - Deploy as a "Docker Compose" resource pointing at this repo.
#   - Set the env vars below in Coolify's Environment Variables UI
#     (Coolify injects them; do not commit real secrets).
#   - Coolify routes traffic through Traefik to the `web` service and
#     injects PORT; the app already listens on 0.0.0.0 (HOSTNAME in Dockerfile).

services:
  web:
    build: .
    restart: unless-stopped
    environment:
      # Internal hostname of the postgres service below.
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/app
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      # Public URL of the app, e.g. https://app.example.com
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Optional S3-compatible storage (leave empty to disable uploads).
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    depends_on:
      db:
        condition: service_healthy
    # No host port mapping needed on Coolify — Traefik reaches the container
    # on the internal network. For a bare VPS without a reverse proxy, add:
    # ports:
    #   - "3000:3000"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
